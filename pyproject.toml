[project]
name = "falcon-net"
version = "0.1.0"
description = "FALCON: Fast Algorithm for Large-scale Cross-domain Compositional Network Inference"
readme = "README.md"
# Pin a Python window where every dependency we use has wheels.
# 3.10 is the floor (NumPy 2.x dropped 3.9); 3.13 is excluded because
# scientific stack stable Python-3.13 wheels are still partial as of
# 2025-Q1 and trip uv's resolver. 3.11 / 3.12 are both safe.
requires-python = ">=3.10,<3.13"
license = { text = "MIT" }
authors = [
    { name = "Jun Rao" },
    { name = "Xiao Liang" },
]
keywords = [
    "compositional data",
    "microbiome",
    "network inference",
    "proportionality",
    "cross-domain",
    "phage-host",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
# Minimal, audited runtime deps. We do not use pandas (CSV I/O is via the
# stdlib csv module). scikit-learn is a runtime dep because comparison_methods.py
# imports it for SPIEC-EASI baselines; if you only use the FALCON algorithms
# themselves (FastProp / RandProp / CrossNet), numpy + scipy are enough.
# Caps below pin to the last versions that still ship manylinux2014_x86_64
# wheels (glibc 2.17 = RHEL 7 / CentOS 7), so installs on legacy HPC nodes
# do not have to fall back to source builds.
dependencies = [
    "numpy>=1.26,<2.3",
    "scipy>=1.11,<1.15",
    "scikit-learn>=1.4,<1.7",
]

[project.urls]
Homepage = "https://github.com/JustinRaoV/FALCONE"
Repository = "https://github.com/JustinRaoV/FALCONE"
Issues = "https://github.com/JustinRaoV/FALCONE/issues"

[project.optional-dependencies]
# Optional: install with `uv sync --extra figures` to enable
# manuscript/figures/generate_*.py
figures = [
    "matplotlib>=3.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/falcon"]

# Only refuse source builds for packages that genuinely require C++17 or
# other modern toolchain features (matplotlib's plotting stack). numpy /
# scipy / scikit-learn are pure C + Fortran and compile on GCC 4.8.5 if
# no manylinux wheel is available for the host platform, so we leave them
# unrestricted to maximise install success on old HPC nodes.
[tool.uv]
no-build-package = ["matplotlib", "contourpy", "kiwisolver", "pillow"]

# Note: matplotlib is intentionally NOT in any default dependency group
# because the server (which only runs the benchmarks) does not need it.
# Old compilers on shared HPC nodes (e.g. GCC 4.8.x) cannot build the
# newest contourpy from source; `uv sync` would then fail unnecessarily.
# To enable figure generation locally, run:  `uv sync --extra figures`
