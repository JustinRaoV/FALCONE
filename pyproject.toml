[project]
name = "falcon-net"
version = "0.2.0"
description = "FALCON: single-domain compositional network estimator (rebuild in progress)"
readme = "README.md"
# Pin a Python window where every dependency we use has wheels.
# 3.10 is the floor (NumPy 2.x dropped 3.9); 3.13 is excluded because the
# scientific stack's stable Python-3.13 wheels are still partial and trip
# uv's resolver. 3.11 / 3.12 are both safe.
requires-python = ">=3.10,<3.13"
license = { text = "MIT" }
authors = [
    { name = "Jun Rao" },
    { name = "Xiao Liang" },
]
keywords = [
    "compositional data",
    "microbiome",
    "network inference",
    "covariance estimation",
    "stability selection",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
# Minimal, audited runtime deps. CSV I/O is via the stdlib `csv` module;
# we do not depend on pandas. The estimators only need numpy + scipy.
# Caps below pin to the last versions that still ship manylinux2014_x86_64
# wheels (glibc 2.17 = RHEL 7 / CentOS 7), so installs on legacy HPC nodes
# do not have to fall back to source builds.
dependencies = [
    "numpy>=1.26,<2.3",
    "scipy>=1.11,<1.15",
]

[project.urls]
Homepage = "https://github.com/JustinRaoV/FALCONE"
Repository = "https://github.com/JustinRaoV/FALCONE"
Issues = "https://github.com/JustinRaoV/FALCONE/issues"

[project.optional-dependencies]
accel = [
    "numba>=0.61,<0.63",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/falcon"]

[dependency-groups]
dev = [
    "psutil>=7.2.2",
    "pytest>=9.0.3",
]

[tool.pytest.ini_options]
pythonpath = [".", "src"]
markers = [
    "diff_baseline: slow per-commit differential test against weighted_sparse baseline (~10 min, but trains at ~15s)",
]
filterwarnings = [
    # macOS Accelerate BLAS + NumPy 2.x spuriously emits
    # "divide by zero / overflow / invalid value encountered in matmul"
    # on valid finite inputs. Silence the false positive in tests; real
    # numerical issues are caught by explicit isfinite assertions.
    "ignore:divide by zero encountered in matmul:RuntimeWarning",
    "ignore:overflow encountered in matmul:RuntimeWarning",
    "ignore:invalid value encountered in matmul:RuntimeWarning",
]
