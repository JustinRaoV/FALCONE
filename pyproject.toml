[project]
name = "falcon-net"
version = "0.1.0"
description = "FALCON: Fast Algorithm for Large-scale Cross-domain Compositional Network Inference"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "[TO FILL: corresponding author]", email = "[TO FILL: email]" },
]
keywords = [
    "compositional data",
    "microbiome",
    "network inference",
    "proportionality",
    "cross-domain",
    "phage-host",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "pandas>=2.0",
]

[project.urls]
Homepage = "[TO FILL: https://github.com/<org>/falcon]"
Repository = "[TO FILL: https://github.com/<org>/falcon]"
Issues = "[TO FILL: https://github.com/<org>/falcon/issues]"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "matplotlib>=3.7",
    "seaborn>=0.12",
]
bench = [
    "memory-profiler>=0.60",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/falcon"]

[tool.uv]
dev-dependencies = [
    "pytest>=7.0",
    "matplotlib>=3.7",
    "seaborn>=0.12",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
